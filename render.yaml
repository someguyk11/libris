services:
  - type: web
    name: libris-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: libris-database
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_ENABLED
        sync: false
      - key: AUTH_ENV
        value: production
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_SESSION_ENCRYPTION_KEY
        sync: false
      - key: AUTH_SECURITY_SECRET
        sync: false
      - key: AUTH_STAFF_USER_IDS
        sync: false
      - key: ATLAS_DEVICE_KEYS
        sync: false
      - key: GUIDANCE_ENABLED
        value: false
    plan: free
    healthCheckPath: /ping
    autoDeploy: false

databases:
  - name: libris-database
    plan: free
    databaseName: libris
    user: libris
