[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_atlas_v1.csv
build_flags = 
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0

; Current Atlas.ino does not wire the unfinished confidence integration.
; Keep that source intact and the original environment unchanged.
[env:atlas-local-drive]
extends = env:esp32dev
build_src_filter = +<*> -<ConfidenceIntegration.cpp>

; Explicit wheels-off-ground motor test only. No navigation or sensor bypass
; is compiled into the normal firmware.
[env:atlas-motor-bench]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DATLAS_MOTOR_BENCH=1
build_src_filter = -<*> +<BenchMotorTest.cpp>
